# DenoFlow: default experiment settings.
# Everything here can be overridden on the command line; see `python main.py --help`.

seed: 42
device: null                    # null -> cuda when available

# ---------------------------------------------------------------- data
dataset: benchmark              # nakanishi2015 | benchmark
dataset_root:
  nakanishi2015: Data/Nakanishi2015
  benchmark: Data/Benchmark
subject: 1
fold: 0
train_ratio: 0.8                # chronological within-subject split
num_banks: 3                    # filter-bank sub-bands

# ---------------------------------------------------------- contamination
artifact: both                  # emg | eog | both
mode: time                      # time -> contiguous span; space -> subset of electrodes
ratio: 0.5                      # mask fraction
snr: 0.0                        # target ratio gamma, in dB, per segment inside the mask

# ------------------------------------------------------------ field network
arch:
  width: 4
  temporal_kernel: 16
  num_layers: 4                 # Transformer encoder layers at the bottleneck
  nhead: 12
  dim_feedforward: 2048
dropout: 0.5

# --------------------------------------------------------------- objective
flow_weight: 1.0                # velocity regression
sample_weight: 1.0              # reconstruction on the integrated output
classification_weight: 1.0      # class term; set to 0 to drop the classifier
train_sample_steps: 4           # S_tr, Euler steps used to form X^ during training
flow_steps: 4                   # S, Euler steps used at inference

# ---------------------------------------------------------------- training
epochs: 300
batch_size: 36
generator_lr: 1.0e-3
generator_weight_decay: 1.0e-4
discriminator_lr: 1.0e-3
discriminator_weight_decay: 1.0e-4
grad_clip: 1.0
eval_interval: 10

# ------------------------------------------------------------- downstream
decoders: [EEGNet, SSVEPNet]
decoder_epochs: 100

output_dir: result
